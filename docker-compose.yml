services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: library
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      MONGO_URL: mongodb://mongo:27017/library
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  mongodata:
